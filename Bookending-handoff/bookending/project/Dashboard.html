<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink: #0E0E10;
    --ink-2: #16161A;
    --ink-3: #1E1E23;
    --rule: #2A2A30;
    --rule-soft: #20202610;
    --paper: #F4EFE6;
    --paper-dim: #D9D2C5;
    --muted: #9A8E7A;
    --muted-2: #6E6557;
    --accent: oklch(0.72 0.16 55);   /* warm ember */
    --accent-2: oklch(0.85 0.10 90); /* aged gold */
    --danger: oklch(0.65 0.18 25);
    --good: oklch(0.78 0.12 145);

    --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
    --sans: "Inter", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; background: var(--ink); color: var(--paper); font-family: var(--sans); }
  body{ font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

  ::selection{ background: var(--accent); color: var(--ink); }

  .mono{ font-family: var(--mono); font-feature-settings: "ss01"; letter-spacing: 0.02em; }
  .serif{ font-family: var(--serif); }
  .smallcaps{ font-family: var(--sans); text-transform: uppercase; letter-spacing: 0.14em; font-size: 10.5px; font-weight: 600; color: var(--muted); }
  .label{ font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .rule{ height:1px; background: var(--rule); border:0; }
  .rule-thick{ height:2px; background: var(--paper); border:0; }

  a{ color: inherit; text-decoration: none; }
  button{ font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* scroll */
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#2a2a30; border-radius:0; }
  ::-webkit-scrollbar-track{ background: transparent; }

  #root{ min-height: 100vh; }
</style>
