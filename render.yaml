services:
  - type: web
    name: bookending-api
    runtime: node
    buildCommand: npm install && npm run build --workspace=packages/shared && npx prisma generate --schema=server/prisma/schema.prisma && npm run build --workspace=server
    startCommand: cd server && npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://bookending.org
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
